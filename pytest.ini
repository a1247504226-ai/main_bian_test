[pytest]
console_output_style = utf-8
markers =
    run: order of tests
addopts =  -p no:warnings
;pytest . --alluredir=temp
;allure generate temp -o allure-report -clean
log_file= ./logs/pytest.log
log_file_level = info
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] %(filename)s::%(funcName)s : %(message)s
log_file_date_format = %Y-%m-%d %H:%M:SS
;addopts = -v